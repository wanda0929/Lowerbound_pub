[package]
name = "minexposure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "minexposure"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
minexposure-core = { path = "../minexposure-core" }
mosek.workspace = true
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true

# Clarabel's SDP backend needs a BLAS/LAPACK provider. Apple Accelerate is only
# available on macOS; every other platform (including Linux orbs) uses OpenBLAS.
[target.'cfg(target_os = "macos")'.dependencies]
clarabel = { workspace = true, features = ["sdp-accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
clarabel = { workspace = true, features = ["sdp-openblas"] }
