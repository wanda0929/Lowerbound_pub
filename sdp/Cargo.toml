[workspace]
members = ["crates/minexposure-core", "crates/minexposure-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://ampcode.com/@wz-s-space/min-exposure-sdp"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clarabel = { version = "0.11", features = ["sdp"] }
mosek = "=11.2.3"
nalgebra = "0.34"
num-bigint = "0.4"
num-integer = "0.1"
num-complex = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.minexposure-core]
opt-level = 2
